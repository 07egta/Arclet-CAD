name: Arclet Windows release candidate

# Isolated from build.yml, melt3d-release.yml and the YURACAD rolling release.
on:
  push:
    branches:
      - release/arclet-windows-web
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_draft:
        description: "Create an unpublished Arclet-only Release draft after all checks"
        type: boolean
        default: false
      acceptance_approved:
        description: "Human Windows acceptance performed and reviewed"
        type: boolean
        default: false
      license_notices_reviewed:
        description: "Human review completed for third-party licenses and packaged notices"
        type: boolean
        default: false
      acceptance_record_url:
        description: "URL of the human acceptance record (required for draft)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # A push and the PR for the same Arclet branch share the same cancellation group.
  group: arclet-release-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Cancel superseded branch/PR builds; never cancel a manually approved draft.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 - Arclet tests, GUI and portable ZIP
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: arclet-windows
      - name: Test Arclet including native save/edit/reopen roundtrip
        run: cargo test --profile ci --locked -p arclet
      - name: Build only Arclet Windows executable
        run: cargo build --release --locked -p arclet
      - name: Verify Arclet executable and create portable ZIP
        shell: pwsh
        run: ./packaging/arclet-windows/package.ps1
      - name: Launch Arclet GUI and capture actual WGPU frames
        shell: pwsh
        run: ./scripts/ci/arclet-windows-smoke.ps1
      - name: Copy startup diagnostics to CI evidence folder
        if: always()
        shell: pwsh
        run: |
          $source = Join-Path $env:LOCALAPPDATA 'Arclet/logs'
          $dest = Join-Path $env:RUNNER_TEMP 'arclet-smoke/logs'
          if (Test-Path $source) {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -Path (Join-Path $source '*.log') -Destination $dest -ErrorAction SilentlyContinue
          }
      - name: Upload Windows GUI and diagnostics evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arclet-windows-evidence
          path: ${{ runner.temp }}/arclet-smoke/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload tested Windows candidate (not a published Release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arclet-windows-candidate
          path: |
            dist/arclet-windows/*.zip
            dist/arclet-windows/*.sha256
          if-no-files-found: error
          retention-days: 14

  release_draft:
    name: Gated UNPUBLISHED Arclet-only Release draft
    needs: [windows]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.create_draft == true &&
      inputs.acceptance_approved == true &&
      inputs.license_notices_reviewed == true &&
      inputs.acceptance_record_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: arclet-release-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: arclet-windows-candidate
          merge-multiple: true
          path: dist
      - name: Verify hashes and identify exact Arclet assets
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name 'ArcletCAD-*-windows-x64.zip' | wc -l)" -eq 1
          for sum in *.sha256; do sha256sum -c "$sum"; done
      - name: Create unique unpublished Arclet draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_EVIDENCE_URL: ${{ inputs.acceptance_record_url }}
        run: |
          set -euo pipefail
          case "$ACCEPTANCE_EVIDENCE_URL" in https://*) ;; *) echo 'Evidence URL must be HTTPS' >&2; exit 1 ;; esac
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Main moved to $current_main after this workflow started; refusing a stale acceptance draft" >&2
            exit 1
          fi
          version="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"] == "arclet"))')"
          tag="arclet-v$version-rc.$GITHUB_RUN_ID"
          cat > notes.md <<EOF
          # Arclet CAD $version - UNPUBLISHED development Release draft

          Commit: $GITHUB_SHA
          CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Interactive acceptance record (reviewed by the dispatching maintainer): $ACCEPTANCE_EVIDENCE_URL

          Arclet executable is arclet.exe, separate from Melt3D and YURACAD.
          ZIP is unsigned; third-party licensing audit requires review.
          Human publication requires additional review.
          EOF
          gh release create "$tag" dist/ArcletCAD-* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Arclet CAD $version - candidate" \
            --notes-file notes.md --draft --prerelease
