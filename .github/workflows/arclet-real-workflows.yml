name: Arclet 100 real workflows

on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/real_workflows/**'
      - '.github/workflows/arclet-real-workflows.yml'
      - 'apps/solidcraft-cli/**'
      - 'crates/engine/**'
      - 'crates/doc/**'
      - 'crates/io/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers
      - name: Catalog structural validation
        run: python3 qa/real_workflows/run.py --validate-only
      - name: Build headless CLI
        run: cargo build --locked --profile ci -p solidcraft-cli
      - name: Execute stage 1 (non-stress)
        run: python3 qa/real_workflows/run.py --cli target/ci/solidcraft-cli --stage 1 --json-out arclet-m40-stage1.json
      - name: Execute independent geometry and I/O smoke cases
        if: success()
        run: python3 qa/real_workflows/run.py --cli target/ci/solidcraft-cli --ids G01,G02,G03,G04,H01,H02,H03,H04,H05,H06,J01 --json-out arclet-m40-geometry-io.json
      - name: Execute all non-stress real workflows
        if: ${{ !cancelled() }}
        run: python3 qa/real_workflows/run.py --cli target/ci/solidcraft-cli --json-out arclet-m40-full-nonstress.json
      - name: Preserve scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arclet-mission40-scenarios
          path: arclet-m40-*.json
          if-no-files-found: warn
          retention-days: 14
