name: Arclet spatial sketching regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/engine/src/cmd/sketch_3d.rs'
      - 'crates/engine/src/cmd/construct.rs'
      - 'crates/engine/src/cmd/sketch_3d_frame_tests.rs'
      - 'crates/doc/src/construct.rs'
      - 'crates/sketch/src/wire.rs'
      - 'crates/geom/src/plane.rs'
      - 'crates/geom/src/tests.rs'
      - '.github/workflows/arclet-spatial-sketching.yml'

permissions:
  contents: read

concurrency:
  group: spatial-sketch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spatial-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Numeric workplane regression
        run: cargo test --profile ci --locked -p solidcraft-geom --lib spatial_workplane_axes_remain_orthonormal_and_recover_large_world_coordinates
      - name: 3D sketching, references, workplanes, spatial path regressions
        run: |
          cargo test --profile ci --locked -p solidcraft-engine --lib sketch_3d::frame_tests::
          cargo test --profile ci --locked -p solidcraft-sketch --lib wire::tests::
