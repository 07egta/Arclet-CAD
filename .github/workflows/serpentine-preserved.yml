name: Serpentine preserved UI experiment
on:
  push:
    branches: ['work/serpentine-ui-perf-*']
    paths: ['experiments/serpentine-preserved/**', '.github/workflows/serpentine-preserved.yml']
permissions:
  contents: read
concurrency:
  group: serpentine-preserved-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.os }} / patched
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      __GLX_VENDOR_LIBRARY_NAME: mesa
      QT_QPA_FONTDIR: ${{ matrix.os == 'windows-latest' && 'C:/Windows/Fonts' || '' }}
    steps:
      - name: Preserve exact LF source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: chisomobanzi/Serpentine3D
          ref: 5a801e0db0ff6bf1d0738430fd9784db4ebfc9b0
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Install desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-xinerama0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Install pinned dependencies
        working-directory: upstream
        run: uv sync --extra dev --locked --python 3.12
      - name: Check and apply reviewed backend patches
        run: |
          mkdir -p evidence
          python experiments/serpentine-preserved/scripts/prepare.py upstream --check --report evidence/preflight.json
          python experiments/serpentine-preserved/scripts/prepare.py upstream --report evidence/ui-preservation.json
          git -C upstream rev-parse HEAD > evidence/upstream-commit.txt
          git rev-parse HEAD > evidence/experiment-commit.txt
      - name: Backend regression contracts
        working-directory: upstream
        run: uv run pytest ../experiments/serpentine-preserved/tests -q --junitxml=../evidence/contracts.xml 2>&1 | tee ../evidence/contracts.log
      - name: Seeded backend microbenchmark
        working-directory: upstream
        run: uv run python ../experiments/serpentine-preserved/scripts/benchmark_backend.py --output ../evidence/benchmark.json 2>&1 | tee ../evidence/benchmark.log
      - name: Complete upstream suite with explicit per-test failure timeout
        working-directory: upstream
        run: uv run --with pytest-timeout==2.4.0 pytest tests/ -q -n 2 --ignore=tests/e2e_dod.py --timeout=300 --timeout-method=thread --durations=30 --junitxml=../evidence/upstream-tests.xml 2>&1 | tee ../evidence/upstream-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serpentine-${{ matrix.os }}-patched-evidence
          path: evidence
          retention-days: 14
  original-ui:
    name: Original Qt UI / same-host comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: xcb
      PYTHONUTF8: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      __GLX_VENDOR_LIBRARY_NAME: mesa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: chisomobanzi/Serpentine3D
          ref: 5a801e0db0ff6bf1d0738430fd9784db4ebfc9b0
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Install real Qt and software OpenGL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-xinerama0 libxcb-cursor0 libfontconfig1 libdbus-1-3 xvfb xauth
      - name: Install pinned dependencies
        working-directory: upstream
        run: uv sync --extra dev --locked --python 3.12
      - name: Check pinned source
        run: |
          mkdir -p evidence
          python experiments/serpentine-preserved/scripts/prepare.py upstream --check --report evidence/preflight.json
      - name: Exercise and capture baseline desktop
        working-directory: upstream
        run: xvfb-run -a -s '-screen 0 1600x1000x24 +extension GLX' uv run python ../experiments/serpentine-preserved/scripts/ui_smoke.py --output ../evidence/gui-before 2>&1 | tee ../evidence/gui-before.log
      - name: Apply backend patches with UI guard
        run: python experiments/serpentine-preserved/scripts/prepare.py upstream --report evidence/ui-preservation.json
      - name: Exercise and capture patched desktop
        working-directory: upstream
        run: xvfb-run -a -s '-screen 0 1600x1000x24 +extension GLX' uv run python ../experiments/serpentine-preserved/scripts/ui_smoke.py --output ../evidence/gui-after 2>&1 | tee ../evidence/gui-after.log
      - name: Compare same-host screenshots
        working-directory: upstream
        run: uv run python ../experiments/serpentine-preserved/scripts/compare_ui.py ../evidence/gui-before/original-ui-quad.png ../evidence/gui-after/original-ui-quad.png --output ../evidence/ui-pixel-comparison.json
      - name: Real keyboard cancel and redo regression
        working-directory: upstream
        run: xvfb-run -a -s '-screen 0 1600x1000x24 +extension GLX' uv run python ../experiments/serpentine-preserved/scripts/ui_history_smoke.py --output ../evidence/history 2>&1 | tee ../evidence/history-keyboard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serpentine-original-ui-evidence
          path: evidence
          retention-days: 14
