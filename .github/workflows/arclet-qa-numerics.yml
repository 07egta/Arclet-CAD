name: Arclet QA - numeric reliability (Mission 30)

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/geom/**'
      - 'qa/**'
      - '.github/workflows/arclet-qa-numerics.yml'
  workflow_dispatch:

concurrency:
  group: arclet-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  numeric:
    name: geometry property checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Toolchain and environment
        shell: bash
        run: |
          rustc --version
          cargo --version
          echo "Runner: $RUNNER_OS, arch=$RUNNER_ARCH"
      - name: Run bounded analytic and property regression tests
        shell: bash
        env:
          RUST_TEST_THREADS: '1'
        run: |
          set -euo pipefail
          cargo test --profile ci --locked -p solidcraft-geom --lib ultimate_quality_ -- --test-threads=1
      - name: Run full geometry library regression suite
        shell: bash
        env:
          RUST_TEST_THREADS: '1'
        run: |
          set -euo pipefail
          cargo test --profile ci --locked -p solidcraft-geom --lib -- --test-threads=1

  cli-smoke:
    name: headless CAD save/import/export/undo/fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check QA script syntax
        run: python3 -m py_compile qa/scripts/ultimate_quality_cli_smoke.py
      - name: Install native Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers
      - name: Build real CLI for end-to-end tests
        run: cargo build --profile ci --locked -p solidcraft-cli --bin solidcraft-cli
      - name: Exercise complete CAD workflow and capture evidence
        run: |
          mkdir -p target/qa-evidence
          python3 qa/scripts/ultimate_quality_cli_smoke.py \
            --cli target/ci/solidcraft-cli \
            --report target/qa-evidence/headless-cli.json
      - name: Retain evidence even if tests fail
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: arclet-headless-quality-evidence
          path: target/qa-evidence/headless-cli.json
          if-no-files-found: warn
          retention-days: 14
