[package]
name = "arclet"
description = "Arclet CAD: a standalone Rust CAD workspace with visual node modeling"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
default-run = "arclet"

[lints]
workspace = true

[dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
egui = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solidcraft-engine = { workspace = true }
solidcraft-geom = { workspace = true }
solidcraft-graph = { workspace = true }
solidcraft-ui-egui = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["x11"] }
rfd = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BeforeUnloadEvent", "Blob", "BlobPropertyBag", "Document", "Element", "Event", "EventTarget", "File", "FileList",
    "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "Location", "Node", "Url", "Window",
] }
