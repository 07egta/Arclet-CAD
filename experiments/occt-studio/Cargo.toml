[package]
name = "arclet-occt-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Experimental Rust CAD application with an Open CASCADE geometry backend"
build = "build.rs"

[workspace]

[features]
default = []
desktop = ["dep:eframe", "dep:glam"]

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
glam = { version = "=0.30.1", optional = true }

[build-dependencies]
cc = "=1.2.20"

[profile.release]
lto = "thin"
codegen-units = 8

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
