[package]
name = "solidcraft-polyclip-cpp"
description = "Optional polygon offset and boolean spike: pure Rust by default, Clipper2 (C++, BSL-1.0) behind the clipper2 feature"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Not a dependency of any default build: nothing in the workspace depends on this crate. See
# docs/cpp-optional.md for why this is an exception to the Rust-only rule in AGENTS.md.
#
# The workspace lints forbid unsafe code; this crate allows it only in src/cpp.rs, and only when
# the optional clipper2 feature is on. Clippy lints are repeated here because `[lints] workspace`
# cannot relax the unsafe lint.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

[features]
default = []
# Builds cpp/shim.cpp against a Clipper2 checkout named by the CLIPPER2_SRC environment variable
# (its CPP/Clipper2Lib directory). Clipper2 is not vendored in this repository.
clipper2 = []

[dependencies]
thiserror = { workspace = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
