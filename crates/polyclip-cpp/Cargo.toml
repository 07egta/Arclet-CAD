[package]
name = "solidcraft-polyclip-cpp"
description = "Polygon offset and boolean (pure Rust; convex polygons only for now)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Pure Rust only: the owner decided on Rust only, so there is no C++ shim. Nothing in the workspace
# depends on this crate yet. The crate name is kept so layering rules and the lock file stay valid.
# Clippy lints are repeated here because `[lints] workspace` cannot relax some of them.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

[dependencies]
thiserror = { workspace = true }

[dev-dependencies]
